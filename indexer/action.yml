name: RAG Indexer
description: Indexa documentos Markdown de un minisite Docusaurus en PostgreSQL+pgvector

inputs:
  docs-path:
    description: Ruta local a la carpeta docs/ del minisite
    required: true
  doc-folder:
    description: Nombre identificador del minisite (e.g. thesis-doc-test-1)
    required: true
  clear:
    description: Borrar registros previos de este doc-folder antes de indexar
    required: false
    default: 'false'
  gemini-api-key:
    required: true
  wif-provider:
    required: true
  wif-service-account:
    required: true
  db-instance:
    description: Cloud SQL instance connection name (project:region:instance)
    required: true
  db-port:
    required: false
    default: '5432'
  db-name:
    required: true
  db-user:
    required: true
  db-password:
    required: true
  microservice-url:
    description: URL del microservicio RAG (para activar schema antes de indexar)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.wif-provider }}
        service_account: ${{ inputs.wif-service-account }}

    - name: Start Cloud SQL Proxy
      shell: bash
      run: |
        curl -fsSL "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64" \
          -o /usr/local/bin/cloud-sql-proxy
        chmod +x /usr/local/bin/cloud-sql-proxy
        cloud-sql-proxy --port ${{ inputs.db-port }} "${{ inputs.db-instance }}" &
        sleep 3

    - name: Index documents
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        DB_HOST: 127.0.0.1
        DB_PORT: ${{ inputs.db-port }}
        DB_NAME: ${{ inputs.db-name }}
        DB_USER: ${{ inputs.db-user }}
        DB_PASSWORD: ${{ inputs.db-password }}
        MICROSERVICE_URL: ${{ inputs.microservice-url }}
        DOC_FOLDER: ${{ inputs.doc-folder }}
        DOCS_PATH: ${{ inputs.docs-path }}
        CLEAR: ${{ inputs.clear }}
      run: python ${{ github.action_path }}/document_processor.py
